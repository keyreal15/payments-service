[project]
name = "payments-service"
version = "1.0.0"
description = "Асинхронный сервис процессинга платежей: FastAPI + FastStream (RabbitMQ) + PostgreSQL, Outbox, Idempotency, Retry, DLQ"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Нижние границы — проверенные версии (точные — в uv.lock).
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.32",
    "alembic>=1.20,<2",
    "faststream[rabbit]>=0.7.7,<0.8",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "PT", "DTZ", "C4", "PIE", "RET", "TID"]
# RUF001-003: кириллица в строках/комментариях — намеренно.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tools", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]  # asyncpg без type hints
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = ["integration: требует PostgreSQL и RabbitMQ (TEST_DATABASE_URL / TEST_RABBITMQ_URL)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
